[package]
name = "auth-webauthn"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
authors = ["Abraham Joongwhan Ahn"]
description = "WebAuthn relying-party ceremonies and verification adapters for Auth Core"
license = "MIT"
repository = "https://github.com/abrahamahn/auth-core"
homepage = "https://github.com/abrahamahn/auth-core"
readme = "README.md"
keywords = ["authentication", "webauthn", "passkey", "fido2"]
categories = ["authentication", "web-programming"]
exclude = ["target/"]

[lib]
path = "src/lib.rs"

[dependencies]
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
