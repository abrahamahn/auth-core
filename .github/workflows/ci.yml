name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - directory: rust
            artifact: auth-core-0.2.0
          - directory: rust-totp
            artifact: auth-totp-0.1.0
          - directory: rust-crypto
            artifact: auth-crypto-0.1.0
          - directory: rust-password-argon2
            artifact: auth-password-argon2-0.1.0
          - directory: rust-jwt
            artifact: auth-jwt-0.1.0
    defaults:
      run:
        working-directory: ${{ matrix.package.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo package --locked
      - run: cargo test --manifest-path target/package/${{ matrix.package.artifact }}/Cargo.toml --all-targets --locked

  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - typescript
          - typescript-totp
          - typescript-crypto-node
          - typescript-password-argon2
          - typescript-jwt-node
          - typescript-http
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: ${{ matrix.directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepack
      - run: pnpm pack --dry-run
